<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 500" width="1280" height="500">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="50%" style="stop-color:#161b22"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
    <!-- Accent gradient -->
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff"/>
      <stop offset="100%" style="stop-color:#79c0ff"/>
    </linearGradient>
    <!-- Green gradient for no-keys badge -->
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#238636"/>
      <stop offset="100%" style="stop-color:#2ea043"/>
    </linearGradient>
    <!-- Warm gradient for security -->
    <linearGradient id="warmGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#d29922"/>
      <stop offset="100%" style="stop-color:#e3b341"/>
    </linearGradient>
    <!-- Purple gradient -->
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a371f7"/>
      <stop offset="100%" style="stop-color:#bc8cff"/>
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <!-- Subtle glow -->
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="500" fill="url(#bg)"/>
  
  <!-- Subtle grid pattern -->
  <g opacity="0.04">
    <line x1="0" y1="160" x2="1280" y2="160" stroke="#58a6ff" stroke-width="0.5"/>
    <line x1="0" y1="320" x2="1280" y2="320" stroke="#58a6ff" stroke-width="0.5"/>
    <line x1="320" y1="0" x2="320" y2="500" stroke="#58a6ff" stroke-width="0.5"/>
    <line x1="640" y1="0" x2="640" y2="500" stroke="#58a6ff" stroke-width="0.5"/>
    <line x1="960" y1="0" x2="960" y2="500" stroke="#58a6ff" stroke-width="0.5"/>
  </g>

  <!-- Decorative circles -->
  <circle cx="1120" cy="120" r="180" fill="#58a6ff" opacity="0.03"/>
  <circle cx="160" cy="500" r="140" fill="#a371f7" opacity="0.04"/>
  <circle cx="1050" cy="480" r="100" fill="#3fb950" opacity="0.03"/>

  <!-- HEADER SECTION -->
  <!-- Pi logo dot -->
  <circle cx="60" cy="70" r="18" fill="url(#accent)" filter="url(#subtleGlow)"/>
  <text x="60" y="78" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="22" font-weight="900" fill="#0d1117" text-anchor="middle">π</text>

  <!-- Package name -->
  <text x="100" y="78" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="36" font-weight="800" fill="#e6edf3" letter-spacing="-0.5">
    <tspan fill="#e6edf3">pi</tspan><tspan fill="url(#accent)">-webaio</tspan>
  </text>

  <!-- Tagline -->
  <text x="100" y="120" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="20" fill="#8b949e" letter-spacing="0.3">
    All-in-one web access tools for pi — search, fetch, crawl &amp; extract with zero configuration
  </text>

  <!-- DIVIDER -->
  <line x1="60" y1="150" x2="1220" y2="150" stroke="#30363d" stroke-width="1"/>

  <!-- 4 TOOL CARDS -->
  <!-- Card 1: aio-websearch -->
  <rect x="60" y="180" width="275" height="180" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <rect x="60" y="180" width="275" height="4" rx="2" fill="url(#accent)"/>
  
  <!-- Search icon (magnifying glass) -->
  <circle cx="100" cy="216" r="14" fill="none" stroke="#58a6ff" stroke-width="3"/>
  <line x1="110" y1="226" x2="122" y2="238" stroke="#58a6ff" stroke-width="3" stroke-linecap="round"/>
  
  <text x="135" y="222" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#e6edf3">aio-websearch</text>
  <text x="80" y="250" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#8b949e" line-height="1.5">
    <tspan x="80" dy="0">Search the web via</tspan>
    <tspan x="80" dy="20">DuckDuckGo · Brave · Google</tspan>
    <tspan x="80" dy="20" font-weight="600" fill="#58a6ff">No API key required</tspan>
  </text>
  <text x="80" y="328" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#484f58">7s cap · parallel · deduplicated</text>

  <!-- Card 2: aio-webfetch -->
  <rect x="355" y="180" width="275" height="180" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <rect x="355" y="180" width="275" height="4" rx="2" fill="url(#purpleGrad)"/>
  
  <!-- Download/fetch icon -->
  <path d="M395 206 L395 230 M385 220 L395 232 L405 220" stroke="#a371f7" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="383" y1="236" x2="407" y2="236" stroke="#a371f7" stroke-width="3" stroke-linecap="round"/>
  
  <text x="430" y="222" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#e6edf3">aio-webfetch</text>
  <text x="375" y="250" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#8b949e">
    <tspan x="375" dy="0">Fetch URLs → Markdown</tspan>
    <tspan x="375" dy="20" font-weight="600" fill="#bc8cff">Anti-bot TLS profiles</tspan>
    <tspan x="375" dy="20">PDF · RSC · GitHub · Readability</tspan>
    <tspan x="375" dy="20" font-weight="600" fill="#a371f7">AI-summarized previews</tspan>
  </text>
  <text x="375" y="340" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#484f58">Smart retry · 30-min cache</text>

  <!-- Card 3: aio-webcontent -->
  <rect x="650" y="180" width="275" height="180" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <rect x="650" y="180" width="275" height="4" rx="2" fill="url(#warmGrad)"/>
  
  <!-- Content/stack icon -->
  <rect x="690" y="206" width="24" height="6" rx="2" fill="#d29922"/>
  <rect x="694" y="218" width="24" height="6" rx="2" fill="#d29922"/>
  <rect x="698" y="230" width="24" height="6" rx="2" fill="#d29922"/>
  
  <text x="728" y="222" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#e6edf3">aio-webcontent</text>
  <text x="670" y="250" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#8b949e">
    <tspan x="670" dy="0">Retrieve cached content</tspan>
    <tspan x="670" dy="20" font-weight="600" fill="#e3b341">Full untruncated data</tspan>
    <tspan x="670" dy="20">No re-download needed</tspan>
  </text>
  <text x="670" y="328" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#484f58">Session storage · always complete</text>

  <!-- Card 4: aio-webpull -->
  <rect x="945" y="180" width="275" height="180" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <rect x="945" y="180" width="275" height="4" rx="2" fill="url(#accent)"/>
  
  <!-- Site/crawl icon -->
  <circle cx="987" cy="214" r="4" fill="#58a6ff"/>
  <circle cx="1005" cy="214" r="4" fill="#58a6ff"/>
  <circle cx="969" cy="226" r="4" fill="#58a6ff"/>
  <circle cx="1005" cy="226" r="4" fill="#58a6ff"/>
  <circle cx="987" cy="200" r="4" fill="#58a6ff"/>
  <line x1="975" y1="216" x2="983" y2="212" stroke="#58a6ff" stroke-width="1.5"/>
  <line x1="983" y1="200" x2="983" y2="212" stroke="#58a6ff" stroke-width="1.5"/>
  <line x1="971" y1="218" x2="975" y2="216" stroke="#58a6ff" stroke-width="1.5"/>
  
  <text x="1020" y="222" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="17" font-weight="700" fill="#e6edf3">aio-webpull</text>
  <text x="965" y="250" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#8b949e">
    <tspan x="965" dy="0">Crawl entire websites</tspan>
    <tspan x="965" dy="20" font-weight="600" fill="#79c0ff">Sitemap · nav · crawl</tspan>
    <tspan x="965" dy="20">Markdown with YAML frontmatter</tspan>
  </text>
  <text x="965" y="328" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#484f58">Configurable max pages</text>

  <!-- DIVIDER -->
  <line x1="60" y1="380" x2="1220" y2="380" stroke="#30363d" stroke-width="1"/>

  <!-- BOTTOM: Installation & values -->
  <!-- Zero-config box -->
  <rect x="60" y="410" width="380" height="55" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="80" y="435" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#e6edf3">Install</text>
  <text x="80" y="455" font-family="'Consolas', 'Cascadia Code', 'JetBrains Mono', monospace" font-size="13" fill="#58a6ff">pi install npm:pi-webaio</text>

  <!-- Zero cost box -->
  <rect x="460" y="410" width="380" height="55" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="480" y="435" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#3fb950">🔑 No API keys needed</text>
  <text x="480" y="455" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#8b949e">Zero cost · No accounts · No rate limits</text>

  <!-- MIT box -->
  <rect x="860" y="410" width="360" height="55" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <text x="880" y="435" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#a371f7">📋 MIT Licensed</text>
  <text x="880" y="455" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="13" fill="#8b949e">Open source · github.com/apmantza/pi-webaio</text>

  <!-- Bottom decor line -->
  <rect x="0" y="496" width="1280" height="4" fill="url(#accent)" opacity="0.5"/>

  <!-- Version tag -->
  <text x="1220" y="490" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="11" fill="#484f58" text-anchor="end">v0.1.8</text>
</svg>
