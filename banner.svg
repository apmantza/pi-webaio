<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" width="1280" height="560">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="50%" style="stop-color:#161b22"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
    <!-- Blue accent -->
    <linearGradient id="blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff"/>
      <stop offset="100%" style="stop-color:#79c0ff"/>
    </linearGradient>
    <!-- Purple gradient -->
    <linearGradient id="purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#a371f7"/>
      <stop offset="100%" style="stop-color:#bc8cff"/>
    </linearGradient>
    <!-- Cyan gradient -->
    <linearGradient id="cyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#39d2c0"/>
      <stop offset="100%" style="stop-color:#56dccb"/>
    </linearGradient>
    <!-- Amber/orange gradient -->
    <linearGradient id="amber" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#d29922"/>
      <stop offset="100%" style="stop-color:#e3b341"/>
    </linearGradient>
    <!-- Green gradient -->
    <linearGradient id="green" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#238636"/>
      <stop offset="100%" style="stop-color:#2ea043"/>
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="560" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g opacity="0.04">
    <line x1="0" y1="140" x2="1280" y2="140" stroke="#58a6ff" stroke-width="0.5"/>
    <line x1="0" y1="280" x2="1280" y2="280" stroke="#58a6ff" stroke-width="0.5"/>
    <line x1="0" y1="420" x2="1280" y2="420" stroke="#58a6ff" stroke-width="0.5"/>
    <line x1="320" y1="0" x2="320" y2="560" stroke="#58a6ff" stroke-width="0.5"/>
    <line x1="640" y1="0" x2="640" y2="560" stroke="#58a6ff" stroke-width="0.5"/>
    <line x1="960" y1="0" x2="960" y2="560" stroke="#58a6ff" stroke-width="0.5"/>
  </g>

  <!-- Decorative circles -->
  <circle cx="1150" cy="100" r="180" fill="#58a6ff" opacity="0.03"/>
  <circle cx="160" cy="520" r="140" fill="#a371f7" opacity="0.04"/>
  <circle cx="1050" cy="530" r="100" fill="#39d2c0" opacity="0.03"/>

  <!-- Pi logo -->
  <g transform="translate(1170, 28) scale(0.08)">
    <path fill="url(#blue)" fill-rule="evenodd" d="M165.29 165.29H517.36V400H400V517.36H282.65V634.72H165.29ZM282.65 282.65V400H400V282.65Z"/>
    <path fill="url(#blue)" d="M517.36 400H634.72V634.72H517.36Z"/>
  </g>

  <!-- Package name -->
  <text x="100" y="70" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="34" font-weight="800" fill="#e6edf3" letter-spacing="-0.5">
    <tspan fill="#e6edf3">pi</tspan><tspan fill="url(#blue)">-webaio</tspan>
  </text>
  <text x="100" y="108" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="18" fill="#8b949e" letter-spacing="0.2">
    All-in-one web tools for pi — search, fetch, crawl, map, retrieve &amp; extract with zero config
  </text>

  <!-- Divider -->
  <line x1="60" y1="138" x2="1220" y2="138" stroke="#30363d" stroke-width="1"/>

  <!-- ============================================ -->
  <!-- ROW 1: websearch | webfetch | webmap -->
  <!-- ============================================ -->

  <!-- Card 1: aio-websearch -->
  <rect x="60" y="168" width="375" height="158" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <rect x="60" y="168" width="375" height="4" rx="2" fill="url(#blue)"/>
  <circle cx="100" cy="204" r="13" fill="none" stroke="#58a6ff" stroke-width="2.5"/>
  <line x1="110" y1="214" x2="120" y2="224" stroke="#58a6ff" stroke-width="2.5" stroke-linecap="round"/>
  <text x="130" y="210" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="16" font-weight="700" fill="#e6edf3">aio-websearch</text>
  <text x="80" y="240" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="12.5" fill="#8b949e">
    <tspan x="80" dy="0">Search the web via</tspan>
    <tspan x="80" dy="19">DuckDuckGo · Brave · Google</tspan>
    <tspan x="80" dy="19" font-weight="600" fill="#58a6ff">No API key required</tspan>
  </text>
  <text x="80" y="305" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="10.5" fill="#484f58">7s cap · parallel · deduplicated · 10min cache</text>

  <!-- Card 2: aio-webfetch -->
  <rect x="452" y="168" width="375" height="158" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <rect x="452" y="168" width="375" height="4" rx="2" fill="url(#purple)"/>
  <path d="M492 194 L492 218 M482 208 L492 220 L502 208" stroke="#a371f7" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="480" y1="224" x2="504" y2="224" stroke="#a371f7" stroke-width="2.5" stroke-linecap="round"/>
  <text x="522" y="210" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="16" font-weight="700" fill="#e6edf3">aio-webfetch</text>
  <text x="472" y="240" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="12.5" fill="#8b949e">
    <tspan x="472" dy="0">Fetch URLs → Markdown</tspan>
    <tspan x="472" dy="19">PDF · JSON · RSC · Readability</tspan>
    <tspan x="472" dy="19" font-weight="600" fill="#bc8cff">AI-summarized · auto escalation</tspan>
  </text>
  <text x="472" y="305" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="10.5" fill="#484f58">Anti-bot TLS · smart retry · batch support</text>

  <!-- Card 3: aio-webmap -->
  <rect x="845" y="168" width="375" height="158" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <rect x="845" y="168" width="375" height="4" rx="2" fill="url(#cyan)"/>
  <circle cx="887" cy="197" r="3.5" fill="#39d2c0"/>
  <circle cx="903" cy="197" r="3.5" fill="#39d2c0"/>
  <circle cx="887" cy="209" r="3.5" fill="#39d2c0"/>
  <circle cx="903" cy="209" r="3.5" fill="#39d2c0"/>
  <circle cx="895" cy="185" r="3.5" fill="#39d2c0"/>
  <line x1="891" y1="199" x2="891" y2="188" stroke="#39d2c0" stroke-width="1.5"/>
  <line x1="895" y1="201" x2="899" y2="199" stroke="#39d2c0" stroke-width="1.5"/>
  <text x="922" y="210" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="16" font-weight="700" fill="#e6edf3">aio-webmap</text>
  <text x="865" y="240" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="12.5" fill="#8b949e">
    <tspan x="865" dy="0">Discover pages without fetching</tspan>
    <tspan x="865" dy="19">robots.txt · sitemaps · llms.txt</tspan>
    <tspan x="865" dy="19" font-weight="600" fill="#56dccb">Preview before webpull</tspan>
  </text>
  <text x="865" y="305" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="10.5" fill="#484f58">Navigation link discovery · structured</text>

  <!-- ============================================ -->
  <!-- ROW 2: webcontent | webresult | webpull -->
  <!-- ============================================ -->

  <!-- Card 4: aio-webcontent -->
  <rect x="60" y="342" width="375" height="158" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <rect x="60" y="342" width="375" height="4" rx="2" fill="url(#amber)"/>
  <rect x="100" y="376" width="22" height="5" rx="2" fill="#d29922"/>
  <rect x="104" y="386" width="22" height="5" rx="2" fill="#d29922"/>
  <rect x="108" y="396" width="22" height="5" rx="2" fill="#d29922"/>
  <text x="140" y="384" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="16" font-weight="700" fill="#e6edf3">aio-webcontent</text>
  <text x="80" y="416" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="12.5" fill="#8b949e">
    <tspan x="80" dy="0">Retrieve cached content by URL</tspan>
    <tspan x="80" dy="19" font-weight="600" fill="#e3b341">Full untruncated data</tspan>
    <tspan x="80" dy="19">Survives restarts · disk cache</tspan>
  </text>
  <text x="80" y="483" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="10.5" fill="#484f58">Lazy-loaded · no re-download needed</text>

  <!-- Card 5: aio-webresult -->
  <rect x="452" y="342" width="375" height="158" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <rect x="452" y="342" width="375" height="4" rx="2" fill="url(#green)"/>
  <rect x="490" y="372" width="16" height="16" rx="3" fill="none" stroke="#2ea043" stroke-width="2"/>
  <circle cx="498" cy="380" r="3" fill="#2ea043"/>
  <line x1="498" y1="383" x2="498" y2="394" stroke="#2ea043" stroke-width="1.5"/>
  <path d="M493 390 L498 394 L503 390" stroke="#2ea043" stroke-width="1.5" fill="none"/>
  <text x="526" y="384" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="16" font-weight="700" fill="#e6edf3">aio-webresult</text>
  <text x="472" y="416" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="12.5" fill="#8b949e">
    <tspan x="472" dy="0">Retrieve by persistent response ID</tspan>
    <tspan x="472" dy="19" font-weight="600" fill="#2ea043">24h TTL · 500 max results</tspan>
    <tspan x="472" dy="19">Shows recent results if ID missing</tspan>
  </text>
  <text x="472" y="483" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="10.5" fill="#484f58">Content-addressed blobs · LRU eviction</text>

  <!-- Card 6: aio-webpull -->
  <rect x="845" y="342" width="375" height="158" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <rect x="845" y="342" width="375" height="4" rx="2" fill="url(#blue)"/>
  <circle cx="888" cy="382" r="4" fill="#58a6ff"/>
  <circle cx="868" cy="394" r="4" fill="#58a6ff"/>
  <circle cx="908" cy="394" r="4" fill="#58a6ff"/>
  <line x1="872" y1="386" x2="884" y2="386" stroke="#58a6ff" stroke-width="1.5"/>
  <line x1="884" y1="374" x2="888" y2="386" stroke="#58a6ff" stroke-width="1.5"/>
  <line x1="892" y1="386" x2="904" y2="386" stroke="#58a6ff" stroke-width="1.5"/>
  <text x="925" y="384" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="16" font-weight="700" fill="#e6edf3">aio-webpull</text>
  <text x="865" y="416" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="12.5" fill="#8b949e">
    <tspan x="865" dy="0">Crawl entire websites</tspan>
    <tspan x="865" dy="19" font-weight="600" fill="#79c0ff">Sitemap · nav · crawl · compile</tspan>
    <tspan x="865" dy="19">Markdown + YAML frontmatter</tspan>
  </text>
  <text x="865" y="483" font-family="'Segoe UI',system-ui,-apple-system,sans-serif" font-size="10.5" fill="#484f58">Configurable max pages · concurrency</text>

  <!-- Divider -->
  <line x1="60" y1="530" x2="1220" y2="530" stroke="#30363d" stroke-width="1"/>

  <!-- Bottom accent -->
  <rect x="0" y="554" width="1280" height="6" fill="url(#blue)" opacity="0.4"/>
</svg>
