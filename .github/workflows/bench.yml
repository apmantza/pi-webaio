name: Extraction Benchmark

# Not wired into per-PR CI — this is a network-dependent benchmark.
# Run manually via workflow_dispatch, or on a weekly schedule.
on:
  workflow_dispatch:
    inputs:
      filter:
        description: "Category filter (comma-separated, e.g. wikipedia,arxiv)"
        required: false
        default: ""
      concurrency:
        description: "Number of parallel fetches"
        required: false
        default: "2"
      timeout:
        description: "Per-URL timeout in ms"
        required: false
        default: "30000"
  schedule:
    # Weekly on Monday at 06:00 UTC
    - cron: "0 6 * * 1"

jobs:
  bench:
    name: Extraction quality benchmark
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # yamllint disable-line rule:line-length
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # yamllint disable-line rule:line-length
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      # Run-shell-injection safety (opengrep/zizmor): workflow_dispatch
      # inputs are attacker-controllable — never interpolate ${{ github.* }}
      # directly into a run: script, where it is parsed as shell code. The
      # values are passed via env: instead and referenced as "$VAR", so bash
      # never re-parses them as operators or command substitutions — and the
      # ARGS array keeps them quoted (no word-splitting or globbing).
      - name: Run benchmark
        env:
          FILTER: ${{ github.event.inputs.filter }}
          CONCURRENCY: ${{ github.event.inputs.concurrency || '2' }}
          TIMEOUT: ${{ github.event.inputs.timeout || '30000' }}
        run: |
          ARGS=(--concurrency "${CONCURRENCY}" --timeout "${TIMEOUT}")
          if [ -n "${FILTER}" ]; then
            ARGS+=(--filter "${FILTER}")
          fi
          node --experimental-strip-types scripts/bench-extraction.mjs \
            "${ARGS[@]}" --json > bench-results.json
          # Also print human-readable scorecard
          node --experimental-strip-types scripts/bench-extraction.mjs \
            "${ARGS[@]}" || true

      - name: Upload scorecard artifact
        # yamllint disable-line rule:line-length
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bench-scorecard-${{ github.run_number }}
          path: bench-results.json
          retention-days: 90
