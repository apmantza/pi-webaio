name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint-and-typecheck:
    name: Lint & type-check
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # yamllint disable-line rule:line-length
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Never persist the GITHUB_TOKEN into .git/config — otherwise any
          # artifact/workspace upload could exfiltrate it (zizmor:artipacked).
          persist-credentials: false

      # yamllint disable-line rule:line-length
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"

      # Internal research/audit notes are local-only by policy (AGENTS.md
      # "Internal-docs policy"). .gitignore matches the Markdown notes by
      # shape, but a glob is narrower than the class on two axes: it is
      # .md-only (inspiration.txt, notes/inspiration walk past it) and it is
      # only as good as its case-folding (INSPIRATION.md too). This gate reads
      # tracked file NAMES at any extension, case-insensitively, so a new
      # spelling fails the build instead of quietly needing another
      # .gitignore line — the previous list named 8 entries, one of them
      # itself a wildcard, and root-level inspiration.md / inspirations.md
      # were still committed.
      - name: No internal research notes tracked
        run: |
          # No `set -e`: the match result is read from $?, and a pipeline
          # error must NOT be indistinguishable from "nothing matched".
          set -uo pipefail
          pattern='inspirat|observability-gaps|perf-improvements'
          files=$(git ls-files) || {
            echo "::error::git ls-files failed; refusing to report clean."
            exit 1
          }
          hits=$(printf '%s\n' "$files" | grep -iE "$pattern")
          rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "::error::Internal-only notes are tracked."
            echo "Untrack them with git rm --cached and keep them as local"
            echo "working artifacts — see the Internal-docs policy in"
            echo "AGENTS.md."
            printf '%s\n' "$hits" | sed 's/^/  /'
            exit 1
          elif [ "$rc" -gt 1 ]; then
            echo "::error::match failed (grep exit $rc); refusing to"
            echo "report clean."
            exit 1
          fi
          echo "No internal research notes tracked ✓"

      # Lockfile check runs BEFORE npm install (#128): npm install normalizes
      # the workspace lock, which masked committed drift (playwright sat in
      # the lock's root `dependencies` while package.json declared it under
      # `optionalDependencies`). Checking the committed bytes is the point.
      - name: Lockfile in sync with package.json
        run: npm run check:lockfile

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # Fail on known-vulnerable PRODUCTION deps (what actually ships to users
      # via `npm install --omit=dev`). Scoped to high/critical to avoid blocking
      # PRs on fix-less moderate advisories; transitive moderate ones are
      # handled by Dependabot security updates. DevDeps are excluded — they
      # never reach users.
      # Peer deps are excluded as well: both peers (pi-coding-agent, pi-tui;
      # #108) are host-provided, and npm overrides do NOT cascade into a
      # peer's subtree, so pi-coding-agent's transitive brace-expansion@5.0.7
      # advisory (GHSA-mh99-v99m-4gvg) cannot be bumped from this repo — it is
      # upstream's responsibility.
      - name: Audit production dependencies
        run: npm audit --omit=dev --omit=peer --audit-level=high

      - name: TypeScript lint
        run: npm run lint

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # yamllint disable-line rule:line-length
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Never persist the GITHUB_TOKEN into .git/config — otherwise any
          # artifact/workspace upload could exfiltrate it (zizmor:artipacked).
          persist-credentials: false

      # yamllint disable-line rule:line-length
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Verify packed static fetch entrypoint without browser or pi peers
        run: npm run test:webfetch-package

      - name: Run formal TLA+ state-space model checkers
        run: npm run test:models

      - name: Run full test suite (all suites)
        # One invocation — Node 24 --experimental-strip-types handles all
        # .mjs files and their .ts imports in ~8s (was 4m50s with tsx).
        # Disable the shared browser pool (P2) — it keeps a live Chromium
        # process alive after tests, which prevents child processes from
        # exiting and hangs the test runner for 6h.
        env:
          PI_WEBAIO_SHARED_BROWSER_POOL: "0"
        run: npm run test:all

  # Simulates pi's real install path: a `git:` install runs `npm install
  # --omit=dev`, which triggers `prepare`. typescript is a devDep and is
  # omitted, so prepare fetches the pinned compiler transiently via npx
  # (typescript@7.0.2) and builds dist/ FROM SOURCE — the path that broke
  # with TS2688 in pi-lens (#193) and that the tarball-based install-test
  # never exercises (the tarball ships pre-built dist/, so it never re-runs
  # the build under --omit=dev).
  prod-install-build:
    name: Production install build (--omit=dev, from source)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # yamllint disable-line rule:line-length
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Never persist the GITHUB_TOKEN into .git/config — otherwise any
          # artifact/workspace upload could exfiltrate it (zizmor:artipacked).
          persist-credentials: false

      # yamllint disable-line rule:line-length
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"

      # --omit=dev omits @types/node (a devDep); typescript is also a devDep,
      # so prepare's npx fallback (typescript@7.0.2) builds dist. pi passes
      # --legacy-peer-deps too, so the pi host peers (and the types they pull
      # in) are NOT installed: without it this job installed the peers and
      # passed while every real pi update failed with 239 missing-type errors.
      # Keep these flags identical to pi's own install command.
      - name: Install without devDeps (pi's flags; prepare builds dist)
        run: npm install --omit=dev --legacy-peer-deps --no-audit --no-fund

      - name: Verify dist built and the compiled entry loads
        run: |
          test -f dist/index.js || \
            (echo "ERROR: dist/index.js not built under --omit=dev" \
              "(TS2688? prepare/build:dist failed)" && exit 1)
          node dist/index.js 2>&1 | tee /tmp/load.txt || true
          # ERR_MODULE_NOT_FOUND = a runtime dep was wrongly in devDependencies.
          # pi-coding-agent and pi-tui (#108) are host-provided peers; their
          # absence is expected here.
          if grep -q "ERR_MODULE_NOT_FOUND\|Cannot find module" /tmp/load.txt \
             && ! grep -Eq "pi-coding-agent|pi-tui" /tmp/load.txt; then
            echo "FAILED: missing runtime module under --omit=dev"
            cat /tmp/load.txt
            exit 1
          fi
          echo "Production --omit=dev build + load OK"

  install-test:
    name: Install test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [lint-and-typecheck, test]
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      # yamllint disable-line rule:line-length
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Never persist the GITHUB_TOKEN into .git/config — otherwise any
          # artifact/workspace upload could exfiltrate it (zizmor:artipacked).
          persist-credentials: false

      # yamllint disable-line rule:line-length
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check production prepare with existing compilers
        run: node --test tests/prepare.test.mjs

      - name: Pack tarball
        run: npm pack

      - name: Verify required files in tarball
        shell: bash
        run: |
          TARBALL=$(ls pi-webaio-*.tgz)
          echo "Checking tarball: $TARBALL"
          # The published entry is compiled JS (prepare builds dist/);
          # pi loads it directly instead of jiti-transpiling source on
          # every startup.
          tar -tzf "$TARBALL" | grep "package/dist/index.js" || \
            (echo "ERROR: dist/index.js missing from tarball" \
              "(prepare build failed?)" && exit 1)
          tar -tzf "$TARBALL" | grep "package/dist/src/webfetch.js" || \
            (echo "ERROR: webfetch.js missing from tarball" && exit 1)
          tar -tzf "$TARBALL" | grep "package/dist/src/webfetch.d.ts" || \
            (echo "ERROR: webfetch.d.ts missing from tarball" && exit 1)
          # Guard against accidentally shipping TS source again
          # (reintroduces the jiti transpile-on-startup cost).
          if tar -tzf "$TARBALL" | grep -E \
            "package/(index\.ts|src/.*\.ts)"; then
            echo "ERROR: TypeScript source leaked into the tarball" && exit 1
          fi
          # Verify pi.extensions points to a real file
          tar -tzf "$TARBALL" | grep "package/bin/" > /dev/null || true
          echo "Tarball contents OK"

      - name: Verify package.json entry points exist in tarball
        shell: bash
        run: |
          TARBALL=$(ls pi-webaio-*.tgz)
          TMPDIR=$(mktemp -d)
          tar -xzf "$TARBALL" -C "$TMPDIR"

          check_field() {
            local field="$1" value="$2"
            if [ ! -f "$TMPDIR/package/$value" ]; then
              echo "ERROR: package.json '$field' points to '$value'" \
                "which is missing from the tarball"
              exit 1
            fi
            echo "OK: $field -> $value"
          }

          export PI_WEBAIO_PKG_DIR="$TMPDIR/package"
          export PKGJSON="$PI_WEBAIO_PKG_DIR/package.json"
          MAIN=$(node -p "require(process.env.PKGJSON).main || ''" 2>/dev/null)
          [ -n "$MAIN" ] && check_field "main" "$MAIN"

          # Check pi.extensions entries — this is what pi actually loads.
          node -e "
            const path = require('path'); const fs = require('fs');
            const pkgDir = process.env.PI_WEBAIO_PKG_DIR;
            const pkg = require(path.join(pkgDir, 'package.json'));
            const exts = (pkg.pi && pkg.pi.extensions) || [];
            if (exts.length === 0) {
              console.error('ERROR: no pi.extensions declared');
              process.exit(1);
            }
            for (const e of exts) {
              if (!fs.existsSync(path.join(pkgDir, e))) {
                console.error(
                  'ERROR: pi.extensions entry missing from tarball: ' + e,
                );
                process.exit(1);
              }
              console.log('OK: pi.extensions -> ' + e);
            }
          "
          rm -rf "$TMPDIR"

      - name: Install from tarball (simulates pi install npm:pi-webaio)
        shell: bash
        run: |
          TARBALL=$(ls pi-webaio-*.tgz)
          # pi-lens-ignore: zizmor:adhoc-packages
          npm install -g "$TARBALL"

      - name: Verify extension entry loads (catches missing node_modules deps)
        shell: bash
        run: |
          INSTALL_DIR=$(npm root -g)/pi-webaio
          cd "$INSTALL_DIR"
          # Simulate how pi loads the extension: the compiled entry,
          # loaded by node.
          # ERR_MODULE_NOT_FOUND = missing dep -> fail
          # Any other error = expected in CI (no pi API available) -> pass
          # pi-coding-agent and pi-tui (#108) are host-provided peer deps;
          # their absence is expected here
          ENTRY=$(node -p "require('./package.json').pi.extensions[0]")
          echo "Loading entry: $ENTRY"
          node "$ENTRY" 2>&1 | tee /tmp/load-output.txt || true
          if grep -q "ERR_MODULE_NOT_FOUND\|Cannot find module" \
             /tmp/load-output.txt \
             && ! grep -Eq "pi-coding-agent|pi-tui" /tmp/load-output.txt; then
            echo "FAILED: missing module dependency detected"
            cat /tmp/load-output.txt
            exit 1
          fi
          echo "Extension import check passed"
