name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      should_release: ${{ steps.meta.outputs.should_release }}
      needs_npm_publish: ${{ steps.meta.outputs.needs_npm_publish }}
    steps:
      # yamllint disable-line rule:line-length
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Compute release metadata
        id: meta
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"

          # Create a GitHub release if the version tag doesn't exist yet. The
          # tag check is the sole guard — no need to also require package.json
          # in the diff, which breaks when the version bump and changelog land
          # in separate commits.
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            SHOULD_RELEASE=false
          else
            SHOULD_RELEASE=true
          fi

          # Publish to npm if this version is not on the registry yet. Checked
          # independently of the tag so a re-run (workflow_dispatch) can
          # publish a version whose tag/release already exists — e.g. after
          # configuring trusted publishing.
          if npm view "pi-webaio@$VERSION" version >/dev/null 2>&1; then
            NEEDS_NPM_PUBLISH=false
          else
            NEEDS_NPM_PUBLISH=true
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "should_release=$SHOULD_RELEASE" >> "$GITHUB_OUTPUT"
          echo "needs_npm_publish=$NEEDS_NPM_PUBLISH" >> "$GITHUB_OUTPUT"

      - name: Verify changelog entry exists
        if: >
          steps.meta.outputs.should_release == 'true' ||
          steps.meta.outputs.needs_npm_publish == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          if ! grep -q "^## \[$VERSION\]" CHANGELOG.md; then
            echo "Missing CHANGELOG entry for version $VERSION"
            exit 1
          fi

      # yamllint disable-line rule:line-length
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        if: steps.meta.outputs.needs_npm_publish == 'true'
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        if: steps.meta.outputs.needs_npm_publish == 'true'
        run: npm install --no-audit --no-fund

      - name: Dry-run publish (validates tarball)
        if: steps.meta.outputs.needs_npm_publish == 'true'
        run: npm publish --dry-run

      # The dry-run above runs prepare (tsc → dist/), so the compiled entry now
      # exists in the working tree. Load it to catch a broken/missing-dep entry
      # before we tag and publish.
      - name: Smoke-load compiled entry
        if: steps.meta.outputs.needs_npm_publish == 'true'
        shell: bash
        run: |
          ENTRY=$(node -p "require('./package.json').pi.extensions[0]")
          echo "Loading entry: $ENTRY"
          node "$ENTRY" 2>&1 | tee /tmp/load-output.txt || true
          if grep -q "ERR_MODULE_NOT_FOUND\|Cannot find module" \
               /tmp/load-output.txt \
             && ! grep -q "pi-coding-agent" /tmp/load-output.txt; then
            echo "FAILED: missing module dependency in compiled entry"
            cat /tmp/load-output.txt
            exit 1
          fi
          echo "Compiled entry loads OK"

  release:
    runs-on: ubuntu-latest
    needs: prepare
    if: needs.prepare.outputs.should_release == 'true'
    permissions:
      contents: write
    steps:
      # yamllint disable-line rule:line-length
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # The release body is the curated CHANGELOG section for this version, not
      # the auto-generated PR-title list — so the release reads as a meaningful
      # summary of what changed. `prepare` already verified the `## [VERSION]`
      # heading exists, so extraction can't be empty.
      - name: Extract release notes from CHANGELOG
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: >
          node scripts/changelog-extract.mjs "$VERSION" --summary
          -o "$RUNNER_TEMP/release-notes.md"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: >
          gh release create "$TAG" --title "$TAG"
          --notes-file "$RUNNER_TEMP/release-notes.md"

  # Publishes via npm trusted publishing (OIDC) — no NPM_TOKEN secret. The
  # trusted publisher must be configured on npmjs.com for pi-webaio, pointing
  # at this repo and this workflow file. npm >= 11.5.1 (bundled with Node 24)
  # detects the GitHub Actions OIDC token automatically during `npm publish`.
  publish-npm:
    runs-on: ubuntu-latest
    needs: [prepare, release]
    # `release` is skipped when the tag already exists; still publish as long
    # as the version is missing from the registry and release didn't FAIL.
    if: >
      always() &&
      needs.prepare.result == 'success' &&
      needs.prepare.outputs.needs_npm_publish == 'true' &&
      needs.release.result != 'failure' &&
      needs.release.result != 'cancelled'
    permissions:
      contents: read
      id-token: write
    steps:
      # yamllint disable-line rule:line-length
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # yamllint disable-line rule:line-length
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Required: the `prepare` script builds dist/ (tsc), which needs
      # node_modules. `npm install` runs prepare here, and `npm publish` runs it
      # again before packing. Without the install the build — and the publish —
      # fails.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Publish to npm (trusted publishing)
        run: npm publish
